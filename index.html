<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCR7 - ULTRA SPORT | إشراف: محمد جواد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 1. إضافة مكتبات Video.js لتشغيل الداخلي m3u8/ts -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        :root {
            --bg: #030712;
            --surface: rgba(15, 23, 42, 0.75);
            --border: rgba(56, 189, 248, 0.2);
            --neon-blue: #00f0ff;
            --neon-pink: #ff0055;
            --neon-green: #10b981;
            --neon-yellow: #facc15;
            --telegram-color: #229ed9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --surface: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 119, 255, 0.2);
            --neon-blue: #0284c7;
            --neon-pink: #e11d48;
            --neon-green: #059669;
            --neon-yellow: #ca8a04;
            --telegram-color: #0088cc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease, border 0.3s ease, transform 0.2s ease;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.08) 0%, transparent 45%);
        }

        /* نافذة الرمز السري */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--surface);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3);
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .auth-icon { font-size: 55px; margin-bottom: 15px; text-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
        .auth-title { color: var(--neon-blue); font-size: 24px; font-weight: 900; margin-bottom: 8px; }
        .auth-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            color: var(--text-main);
            font-size: 22px;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            letter-spacing: 6px;
            margin-bottom: 20px;
            outline: none;
        }
        .auth-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }

        .auth-btn {
            background: linear-gradient(135deg, var(--neon-blue), #0284c7);
            color: #030712;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
        }
        .auth-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

        .auth-error {
            color: var(--neon-pink);
            font-size: 13px;
            font-weight: 700;
            margin-top: 15px;
            display: none;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .container { max-width: 950px; margin: 0 auto; }

        /* الهيدر */
        .hero-header {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 22px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .hero-header::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-blue), var(--neon-pink));
        }

        .logo-area h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-blue), var(--text-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .developer-tag {
            font-size: 12px;
            color: var(--neon-pink);
            font-weight: 700;
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .telegram-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--telegram-color), #0077b5);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: tgPulse 2s infinite;
        }
        .telegram-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
        .telegram-icon { width: 18px; height: 18px; fill: #ffffff; }

        @keyframes tgPulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 158, 217, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(34, 158, 217, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 158, 217, 0); }
        }

        .theme-toggle {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
        }
        .theme-toggle:hover { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }

        /* 1. شاشة العرض الجديدة مع المشغل الداخلي */
        #player-section {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-blue);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 240, 255, 0.18);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .player-title { color: var(--neon-blue); font-weight: 800; font-size: 18px; margin: 0; }

        /* 2. تنسيق المشغل الداخلي ليناسب الثيم النيوني */
        .video-js.vjs-theme-neon {
            border-radius: 14px;
            border: 2px solid var(--neon-blue);
            overflow: hidden;
            background: #000; /* خلفية سوداء قبل التحميل */
        }

        /* تغيير لون أشرطة التحكم لتناسب الثيم */
        .vjs-theme-neon .vjs-control-bar {
            background: rgba(0, 0, 0, 0.7); /* شريط تحكم شفاف */
        }
        .vjs-theme-neon .vjs-play-progress,
        .vjs-theme-neon .vjs-volume-level {
            background: var(--neon-blue);
        }
        .vjs-theme-neon .vjs-big-play-button {
            background: rgba(0, 240, 255, 0.15); /* زر تشغيل كبير نيوني */
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            line-height: 60px;
            height: 60px;
            width: 60px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
        }
        .vjs-theme-neon .vjs-big-play-button:hover {
            background: rgba(0, 240, 255, 0.4);
        }

        /* 3. قسم التوقيت */
        .timing-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .timing-item { text-align: center; }
        .timing-label { font-size: 12px; color: var(--text-muted); font-weight: bold; }
        .timing-value { font-size: 16px; color: var(--neon-yellow); font-weight: 900; margin-top: 3px; }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--neon-blue);
            margin: 30px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* 4. شبكة القنوات */
        .grid-cards { display: grid; grid-template-columns: 1fr; gap: 15px; }

            background: var(--surface);
            backdrop-filter: blur
