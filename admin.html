<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم محمد جواد - MCR7</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: rgba(15, 23, 42, 0.75);
            --border: rgba(56, 189, 248, 0.2);
            --neon-blue: #00f0ff;
            --neon-pink: #ff0055;
            --neon-green: #10b981;
            --neon-yellow: #facc15;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease, border 0.3s ease, transform 0.2s ease;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.08) 0%, transparent 45%);
        }

        .container { max-width: 950px; margin: 0 auto; }

        .control-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--neon-blue);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Tajawal', sans-serif;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--neon-blue), #0284c7);
            color: #030712;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
            margin-top: 5px;
        }

        .btn-submit:hover { filter: brightness(1.15); transform: scale(1.01); }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- قسم تغيير الرمز -->
        <div class="control-card">
            <div class="section-title">🔐 تغيير رمز الدخول السري للموقع</div>
            <div class="form-group">
                <input type="password" id="new-pin" class="form-input" placeholder="أدخل رمز موقع المشاهدين الجديد">
            </div>
            <button class="btn-submit" onclick="updatePin()">تحديث رمز الموقع ⚡</button>
        </div>

        <!-- قسم إضافة قناة جديدة -->
        <div class="control-card">
            <div class="section-title">📺 إضافة قناة جديدة للبث (مع الحماية)</div>
            
            <div class="form-group">
                <input type="text" id="ch-name" class="form-input" placeholder="اسم القناة (مثال: beIN SPORTS 1)">
            </div>
            <div class="form-group">
                <input type="text" id="ch-url" class="form-input" placeholder="رابط البث الأصلي (m3u8.)">
            </div>
            <div class="form-group">
                <input type="text" id="ch-ua" class="form-input" placeholder="User-Agent الخاص بالقناة">
            </div>
            <div class="form-group">
                <input type="text" id="ch-ref" class="form-input" placeholder="Referer (مثال: https://x.com/)">
            </div>

            <button class="btn-submit" onclick="addChannel()">إضافة القناة للنظام 🚀</button>
            <div id="channels-list-status" class="empty-msg" style="margin-top: 15px;">لا توجد قنوات مضافة حالياً.</div>
        </div>

    </div>

    <script>
        function updatePin() {
            const pin = document.getElementById('new-pin').value;
            if(!pin) {
                alert('الرجاء إدخال الرمز الجديد!');
                return;
            }
            alert('تم تحديث رمز الدخول بنجاح!');
            document.getElementById('new-pin').value = '';
        }

        function addChannel() {
            const name = document.getElementById('ch-name').value;
            const url = document.getElementById('ch-url').value;
            const ua = document.getElementById('ch-ua').value;
            const ref = document.getElementById('ch-ref').value;

            if(!name || !url) {
                alert('الرجاء إدخال اسم القناة ورابط البث على الأقل!');
                return;
            }

            // تخزين البيانات أو معالجتها للإرسال لملف الـ JSON
            const channelData = { name, url, ua, ref };
            console.log("تم تجهيز القناة:", channelData);

            alert('تمت إضافة القناة مع بيانات الحماية بنجاح! 🟢');
            
            // تفريغ الحقول بعد الإضافة
            document.getElementById('ch-name').value = '';
            document.getElementById('ch-url').value = '';
            document.getElementById('ch-ua').value = '';
            document.getElementById('ch-ref').value = '';
            document.getElementById('channels-list-status').innerText = `تمت إضافة آخر قناة: ${name}`;
        }
    </script>

</body>
</html>
